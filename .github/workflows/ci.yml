name: CI

on:
  push:
    # go-main is the migration integration branch ("main" until cutover). Build/test/parity/coverage
    # run on it, but the publish/release jobs (docker, register-sobs-release, cleanup-ghcr) stay gated
    # to main/master/tags via their own `if:` — so go-main never publishes artifacts.
    branches: [main, master, go-main]
    tags: ['v*']
  pull_request:
    branches: [main, master, go-main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Go modules resolve through the in-cluster Athens proxy (ci-cache, ClusterIP/IPv4) — no per-runner
  # internet egress and a shared persistent module cache. GOSUMDB=off: the committed go.sum verifies
  # integrity locally; sum.golang.org isn't reachable from the IPv4-only, netpol'd runners.
  GOPROXY: http://athens.ci-cache.svc.cluster.local:5000
  GOSUMDB: "off"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: sobs-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci.yml

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

  go-build-test:
    name: Go Build & Test
    runs-on: sobs-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt (formatting gate)
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These Go files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: go build
        working-directory: go
        run: go build ./...

      # chdb-go loads libchdb at runtime via purego (dlopen), so build/vet need no native lib —
      # but `go test` boots an embedded chdb. Fetch the EXACT pinned chdb-core build that Python
      # chdb 4.1.9 ships (see go/CHDB_PIN.md); a drifting kernel could write a store the Python
      # side can no longer open. The ~60MB tarball is identical across every job/run for a given
      # version, so cache it (keyed on the version) to skip the download on a hit.
      - name: Fetch pinned libchdb (chdb-core v26.5.0, cached on the /cache PVC)
        # The GitHub Actions cache backend is unreachable from the cluster runners, so persist the
        # ~60MB lib on the shared runner-cache PVC (/cache) and force IPv4 (the cluster has no IPv6
        # internet egress; an unforced curl picks the AAAA address and fails "network unreachable").
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.libchdb"
          cached=/cache/libchdb/v26.5.0/libchdb.so
          if [ -f "$cached" ]; then
            cp "$cached" "${GITHUB_WORKSPACE}/.libchdb/libchdb.so"
          else
            curl -4 -fsSL -o /tmp/libchdb.tar.gz \
              https://github.com/chdb-io/chdb-core/releases/download/v26.5.0/linux-x86_64-libchdb.tar.gz
            tar -xzf /tmp/libchdb.tar.gz -C "${GITHUB_WORKSPACE}/.libchdb"
            mkdir -p "$(dirname "$cached")" && cp "${GITHUB_WORKSPACE}/.libchdb/libchdb.so" "$cached" || true
          fi
          test -f "${GITHUB_WORKSPACE}/.libchdb/libchdb.so"

      - name: go test
        working-directory: go
        env:
          CHDB_LIB_PATH: ${{ github.workspace }}/.libchdb/libchdb.so
        # chdb (embedded ClickHouse) crashes on init when RLIMIT_NOFILE is the container "infinity"
        # (~1e9): ClickHouse iterates/closes every fd up to the soft limit. The runner agent runs
        # steps with that huge default, so chdb SIGSEGVs here even though it runs fine with a sane
        # limit. Cap nofile to 1M. -p 2 also bounds concurrent chdb instances.
        run: go test -p 2 -count=1 ./...

  parity:
    name: Go Parity (byte-diff vs Python oracle)
    runs-on: sobs-runners
    # Independent of go-build-test (run_parity_ci.py builds its own Go binary) — run in parallel.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci.yml

      - name: Install runtime dependencies (Python oracle + chdb 4.1.9)
        # pyyaml is a migration-tool dep (capture_routes reads routes.yaml) not in requirements.txt.
        run: pip install -r requirements.txt pyyaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The Go server reads/writes the SAME on-disk chdb store the Python oracle created, so its
      # native libchdb MUST match the Python chdb 4.1.9 wheel (chdb-core v26.5.0). The Python side
      # uses its own bundled lib; CHDB_LIB_PATH only configures the Go side. Cached (keyed on the
      # version) and shared with go-build-test, so only the first job per run pays the download.
      - name: Fetch pinned libchdb (chdb-core v26.5.0, cached on the /cache PVC)
        # The GitHub Actions cache backend is unreachable from the cluster runners, so persist the
        # ~60MB lib on the shared runner-cache PVC (/cache) and force IPv4 (the cluster has no IPv6
        # internet egress; an unforced curl picks the AAAA address and fails "network unreachable").
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.libchdb"
          cached=/cache/libchdb/v26.5.0/libchdb.so
          if [ -f "$cached" ]; then
            cp "$cached" "${GITHUB_WORKSPACE}/.libchdb/libchdb.so"
          else
            curl -4 -fsSL -o /tmp/libchdb.tar.gz \
              https://github.com/chdb-io/chdb-core/releases/download/v26.5.0/linux-x86_64-libchdb.tar.gz
            tar -xzf /tmp/libchdb.tar.gz -C "${GITHUB_WORKSPACE}/.libchdb"
            mkdir -p "$(dirname "$cached")" && cp "${GITHUB_WORKSPACE}/.libchdb/libchdb.so" "$cached" || true
          fi
          test -f "${GITHUB_WORKSPACE}/.libchdb/libchdb.so"

      - name: Capture goldens from the Python oracle and byte-diff the Go replay
        env:
          CHDB_LIB_PATH: ${{ github.workspace }}/.libchdb/libchdb.so
        # Cap RLIMIT_NOFILE: chdb/ClickHouse SIGSEGVs on init under the runner agent's "infinity"
        # (~1e9) fd limit (it iterates all fds). See the go-build-test note.
        run: |
          ulimit -n 1048576 || true
          python migration/tools/run_parity_ci.py

  oracle-coverage:
    name: Oracle Coverage (app.py capture-coverage ratchet)
    # Migration-specific gate: measures what fraction of the Python oracle the differential corpus
    # exercises (the rest is unverified by parity). Runs only in a go-main context to keep it off
    # main's pipeline. Python-only (no Go replay) — uses the bundled chdb wheel.
    if: github.ref == 'refs/heads/go-main' || github.base_ref == 'go-main' || github.event_name == 'workflow_dispatch'
    runs-on: sobs-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci.yml

      - name: Structural checks (route matrix / constant allowlists / stubs)
        # stdlib-only + fast — fails early on a Python route with no Go handler before the slow capture.
        run: python migration/tools/structural_checks.py

      - name: Install runtime dependencies + coverage
        run: pip install -r requirements.txt pyyaml coverage

      - name: Measure app.py oracle coverage across all profiles
        run: python migration/tools/coverage_capture.py

      - name: Enforce coverage floor (ratchet — bump migration/COVERAGE_FLOOR as it rises)
        run: python migration/tools/coverage_gate.py

  docker-go-smoke:
    name: Go Image Build & Smoke
    runs-on: sobs-runners
    # Builds its own image from source — independent of go-build-test, so run in parallel.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build the stripped-down Go image
        # --network=host: the dind sidecar shares the runner pod's network namespace, so the build can
        # reach the in-cluster Athens proxy (ClusterIP:5000, permitted by the egress netpol) for
        # `go mod download`. GOPROXY/GOSUMDB come from the workflow env.
        run: |
          docker build --network=host \
            --build-arg GOPROXY="${GOPROXY}" \
            --build-arg GOSUMDB="${GOSUMDB}" \
            -f Dockerfile.go -t sobs-go:ci .

      - name: Start the container (empty /data — must self-seed its schema)
        run: docker run -d --name sobs-go -p 4317:4317 sobs-go:ci

      - name: Smoke-test the running image
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4317/health >/dev/null 2>&1 && break
            sleep 2
          done
          assert_200() {
            code="$(curl -s -o /dev/null -w '%{http_code}' "$1")"
            echo "  $1 -> $code"
            test "$code" = "200"
          }
          # /health/db runs SELECT 1 -> proves the binary runs, libchdb dlopens, chdb opens.
          assert_200 http://127.0.0.1:4317/health
          assert_200 http://127.0.0.1:4317/health/db
          # /api/reports queries a real table -> proves the schema self-initialized (ensureSchema).
          body="$(curl -fsS http://127.0.0.1:4317/api/reports)"
          echo "  /api/reports -> $body"
          test "$body" = "[]"
          # / renders a Jinja page -> proves templates/ + static/ are bundled and the engine works.
          assert_200 http://127.0.0.1:4317/

      - name: Container logs
        if: always()
        run: docker logs sobs-go || true

  rum-build:
    name: RUM JS Build & Type Check
    runs-on: sobs-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check rum.d.ts
        run: npm run typecheck:rum

      - name: Build rum assets (dev + prod)
        run: npm run build:rum

      - name: Verify minified output exists
        run: |
          test -f static/rum.min.js   || (echo "rum.min.js missing" && exit 1)
          test -f static/rum.min.js.map || (echo "rum.min.js.map missing" && exit 1)
          test -f static/rum.js.map   || (echo "rum.js.map missing" && exit 1)

      - name: Upload rum.min.js.map artifact
        uses: actions/upload-artifact@v7
        with:
          name: rum-min-js-sourcemap
          path: static/rum.min.js.map
          if-no-files-found: error

  lint:
    name: Code Style & Linting
    runs-on: sobs-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml
            .github/cache-key-lint.txt

      - name: Install linting dependencies
        run: pip install black isort flake8 mypy djlint flask

      - name: Run black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

      - name: Run flake8
        run: flake8 .

      - name: Run mypy
        run: mypy app.py

      - name: Run djlint
        run: python3 scripts/run_djlint.py --check --lint templates

  test:
    name: Tests
    runs-on: sobs-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integration.txt
            pyproject.toml
            .github/workflows/ci.yml
            .github/cache-key-runtime.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-integration.txt

      - name: Run unit tests with coverage
        run: |
          echo "SOBS/chDB env snapshot"
          env | sort | grep -E '^(SOBS_|CHDB_)' || true
          pytest tests --ignore=tests/test_integration.py -x --maxfail=1 -vv \
            --cov=app --cov=masking --cov=mcp \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Diff coverage gate
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  integration:
    name: Integration Tests
    runs-on: sobs-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integration.txt
            pyproject.toml
            .github/workflows/ci.yml
            .github/cache-key-runtime.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-integration.txt', '.github/workflows/ci.yml', '.github/cache-key-runtime.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-integration.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run integration tests
        env:
          SOBS_UIQA_SEED_TOTAL: "64"
          SOBS_UIQA_SEED_WORKERS: "8"
          SOBS_SCREENSHOT_SEED_TOTAL: "240"
          SOBS_SCREENSHOT_SEED_WORKERS: "24"
          # Disable the chDB server memory cap in CI. The limit is a production
          # safeguard for constrained containers; the CI runner has ample RAM and
          # enforcing it only causes false failures as baseline RSS varies.
          SOBS_CHDB_MAX_SERVER_MB: "0"
        run: pytest tests/test_integration.py -v

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-screenshots
          path: tests/screenshots/
          if-no-files-found: warn

  docker:
    name: Build & Push Docker Image (Go)
    runs-on: sobs-runners
    # The published image is the Go server (the cutover artifact). Gate on the Go pipeline + the
    # Python oracle suite that proves parity, so a release only ships a parity-verified Go build.
    needs: [integration, parity, docker-go-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve build version
        id: build_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push multi-arch Docker image (Go)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.go
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOBS_BUILD_VERSION=${{ steps.build_version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  register-sobs-release:
    name: Register SOBS Release Metadata
    runs-on: sobs-runners
    needs: [docker, rum-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: read
    env:
      SOBS_BASE_URL: ${{ secrets.SOBS_URL }}
      SOBS_API_KEY: ${{ secrets.SOBS_INGEST_API_KEY }}
    steps:
      - name: Determine whether SOBS registration is enabled
        id: sobs_gate
        run: |
          if [[ -z "${SOBS_BASE_URL}" || -z "${SOBS_API_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6

      - name: Set up Python
        if: steps.sobs_gate.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Resolve release version
        id: release_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve deterministic release id
        id: release_id
        run: |
          release_key="${GITHUB_REPOSITORY}|${{ steps.release_version.outputs.value }}|${GITHUB_SHA}|${GITHUB_RUN_ID}|production"
          release_id=$(printf "%s" "${release_key}" | shasum -a 256 | awk '{print $1}')
          echo "value=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Download rum.min.js.map artifact
        uses: actions/download-artifact@v8
        with:
          name: rum-min-js-sourcemap
          path: static

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Extract resolved dependency snapshot (Go modules)
        run: |
          set -euo pipefail
          mkdir -p sobs-release
          # The published image is the Go server; record its module graph (platform-independent)
          # in place of the old per-arch pip freeze.
          (cd go && go list -m all) > sobs-release/go-modules.txt
          test -s sobs-release/go-modules.txt

      - name: Upload dependency snapshot
        uses: actions/upload-artifact@v7
        with:
          name: sobs-release-dependency-snapshots
          path: sobs-release/go-modules.txt
          if-no-files-found: error

      - name: Register release, dependency, and artifact metadata
        if: steps.sobs_gate.outputs.enabled == 'true'
        env:
          SOBS_APP_NAME: sobs
          SOBS_APP_SLUG: sobs
          SOBS_APP_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SOBS_DEFAULT_ENVIRONMENT: production
          SOBS_RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
          SOBS_RELEASE_COMMIT_SHA: ${{ github.sha }}
          SOBS_RELEASE_BUILD_ID: ${{ github.run_id }}
          SOBS_RELEASE_ENVIRONMENT: production
          SOBS_RELEASE_ID: ${{ steps.release_id.outputs.value }}
        run: |
          set -euo pipefail
          # Go modules are platform-independent, so a single snapshot replaces the old per-arch
          # Python freezes; the image itself is multi-arch.
          dep_file="sobs-release/go-modules.txt"
          rum_size=$(wc -c < static/rum.min.js.map)
          dep_size=$(wc -c < "${dep_file}")
          rum_sha=$(shasum -a 256 static/rum.min.js.map | awk '{print $1}')
          dep_sha=$(shasum -a 256 "${dep_file}" | awk '{print $1}')
          python scripts/register_release_artifacts.py \
            --requirements-file "${dep_file}" \
            --dependencies-name "go-modules" \
            --dependencies-storage-ref "ci://artifacts/go-modules.txt" \
            --dependencies-checksum-sha256 "${dep_sha}" \
            --dependencies-size "${dep_size}" \
            --dependencies-platform "linux" \
            --dependencies-architecture "multi" \
            --artifacts-json "[{\"artifactType\":\"js_sourcemap\",\"name\":\"rum.min.js.map\",\"contentType\":\"application/json\",\"size\":${rum_size},\"storageRef\":\"ci://artifacts/rum.min.js.map\",\"checksumSha256\":\"${rum_sha}\",\"platform\":\"linux\",\"architecture\":\"multi\"}]"

  cleanup-ghcr:
    name: Cleanup Stale GHCR Versions
    runs-on: sobs-runners
    needs: docker
    if: false # Disabled: issue #223 - cleanup is too aggressive and removes the latest tag
    permissions:
      packages: write
    steps:
      - name: Delete untagged GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: sobs
          package-type: container
          delete-only-untagged-versions: true

      - name: Delete old SHA-tagged versions (keep latest + v* releases)
        uses: actions/delete-package-versions@v5
        with:
          package-name: sobs
          package-type: container
          delete-only-untagged-versions: false
          ignore-versions: '^(latest|v\d+\..*)$'
          min-versions-to-keep: 1

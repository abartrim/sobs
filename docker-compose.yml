# Local stack for the Go SOBS server (the cutover artifact). `docker compose up` builds the
# stripped Go image, starts it with a fresh /data volume (the server self-seeds its schema on
# first run), and runs a loadgen sidecar that drives example telemetry at it so the UI populates.
#
# Hot-reload dev loop:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   (swaps `sobs` for the air container that rebuilds + restarts on every Go source save).

services:
  sobs:
    build:
      context: .
      dockerfile: Dockerfile.go
    image: ghcr.io/abartrim/sobs-go:latest
    container_name: sobs
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "44317:4317"
    volumes:
      - sobs_data:/data
    environment:
      # Bind on all interfaces so the published port is reachable; the server self-initializes its
      # chdb schema in SOBS_DATA_DIR if absent ("make if not found").
      - SOBS_HOST=0.0.0.0
      - SOBS_PORT=4317
      - SOBS_DATA_DIR=/data
      # Session signing key — always set explicitly in production.
      - SOBS_SECRET_KEY=change-me-in-production
      # Optional ingest API key (send via X-API-Key); empty disables the check.
      - SOBS_API_KEY=
      # AI assistant (configure in Settings → AI or via these env vars). Empty leaves it unconfigured.
      - SOBS_AI_ENDPOINT_URL=
      - SOBS_AI_MODEL=
      - SOBS_AI_GUARD_ENDPOINT_URL=
      - SOBS_AI_GUARD_MODEL=
    restart: unless-stopped
    healthcheck:
      # The slim Go image has no python/curl; the binary self-probes /health.
      test: ["CMD", "/app/sobs", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Traffic generator: replays example logs/traces/errors/RUM/metrics/AI spans at the OTLP-style
  # /v1/* ingest endpoints so a fresh instance shows live data. Pure HTTP — backend-language
  # agnostic. Waits for sobs to be healthy, then loops.
  loadgen:
    image: python:3.14-slim
    container_name: sobs-loadgen
    depends_on:
      sobs:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir requests >/dev/null
        echo "loadgen: sending example telemetry to http://sobs:4317 …"
        while true; do
          python /scripts/load_example.py --base http://sobs:4317 --total 200 --workers 8 || true
          sleep 20
        done
    restart: unless-stopped

volumes:
  sobs_data:

# validate-regex sample-probe coverage (FUNCTION_PARITY_AUDIT finding H7). The empty-body entries
# above only hit the no-pattern guard; these send a REAL pattern so the expression validation AND
# the best-effort sample probe run. Each *_sample entry runs under an isolated profile that seeds
# ONE in-window row (now()-1h, real wall-clock) whose sample column holds a FIXED token, so the
# probe deterministically returns that exact, timestamp-independent string. The *_invalid entry
# hits the structural-error branch (parser-level, no DB) whose message is regex-engine-independent.
- id: post__api_logs_validate_regex__sample
  path: /api/logs/validate-regex
  profile: regexlogs
  methods:
  - POST
  request:
    method: POST
    json:
      pattern: "sobs-regex-probe-logs"

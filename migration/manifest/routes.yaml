# auto_metrics_rules_dashboard CREATE (M36): action=create over the dashauto profile. The base
# example seeder seeds 10 active anomaly rules (the _seed_example_metrics_content threshold/composite
# rules + the default Core-Web-Vitals threshold rules), all with a valid SignalSource/SignalName, so
# _build_auto_dashboard_chart_candidates yields 10 candidates with no service_filter; max_charts

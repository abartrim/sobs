- id: get__api_web_traffic_browsers__external_reject
  path: /api/web-traffic/browsers
  methods:
  - GET
  profile: authextfail
  request:
    method: GET
    headers:
      Authorization: "Bearer parity-ext-token"
# invalid mode: both basic creds AND an external URL configured -> _auth_mode()=="invalid" -> 500

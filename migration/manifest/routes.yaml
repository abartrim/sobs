# dmsecret profile: SOBS_SETTINGS_ENCRYPTION_KEY set. The POST stores both DM secrets (Fernet-
# encrypted at rest); the response is the deterministic "Settings saved" redirect. Runs BEFORE the
# GET below so the GET (same per-profile server) reloads the just-saved secrets.
- id: post__settings_data_management__encrypted_secrets
  path: /settings/data-management
  methods:
  - POST
  profile: dmsecret
  request:
    method: POST
    form:
      s3_secret_access_key: wJalrXUtnFEMIKEXAMPLEKEY1234567890ab
      backup_encryption_password: backup-encryption-pass-9000
# Reload after the save: dm_secret_present is computed from the raw (encrypted) stored value, so
# both secrets render "currently stored" while their values stay masked to "". db-stats card masked
# (same reason as get__settings_data_management — non-deterministic system.parts merge state).
- id: get__settings_data_management__secrets_present
  path: /settings/data-management
  methods:
  - GET
  profile: dmsecret
  mask:
  - <table class="table table-sm table-hover mb-0 dm-stats-table">[\s\S]*?</table>
  - Total rows \(active parts\)</td>\s*<td class="fw-semibold">\s*[0-9,]+
  - <td class="fw-semibold">[0-9][0-9.]* [A-Z]*B</td>
  - "[0-9]+\\.[0-9]+\xD7|[0-9]+\xD7"
  - <span class="text-(?:warning|success)">\s*[0-9]+
# dmttl profile: data-management save with apply_ttl=1 (app.py save_dm_settings -> _apply_dm_ttl).
# Parity-invisible on the base empty POST, so a dedicated profile exercises the TTL branch. The
# OTel tables exist in the base fixture, so the day-based ALTER … MODIFY TTL runs for real; the
# profile is isolated (its own fixture copy) so the schema mutations never ripple into base otel
# readers. These three entries run IN ORDER on one server. NOTE: ttl_metrics_hours' ALTER builds
# intDiv(TimeUnixMs, …) but TimeUnixMs is a DateTime column, so chDB rejects it (ILLEGAL_TYPE) — a
# genuine app.py bug. The port mirrors it, but the exception text is not byte-stable, so the
# success case omits metrics (day ALTERs only) and the error cases keep metrics non-positive so
# its message comes from validation, never from executing the broken ALTER.
- id: post__settings_data_management__apply_ttl_ok
  path: /settings/data-management
  methods:
  - POST
  profile: dmttl
  request:
    method: POST
    form:
      apply_ttl: "1"
      ttl_logs_days: "30"
      ttl_traces_days: "14"
      ttl_sessions_days: "7"
# Two validation errors (logs day + metrics hour both non-positive): exercises both the per-table
# day message and the metrics message, joined with "; ". Neither runs an ALTER (validation first).
- id: post__settings_data_management__apply_ttl_invalid
  path: /settings/data-management
  methods:
  - POST
  profile: dmttl
  request:
    method: POST
    form:
      apply_ttl: "1"
      ttl_logs_days: "0"
      ttl_metrics_hours: "-1"
# Four validation errors (all three day tables + metrics): exercises the errors[:3] truncation —
# the metrics error is dropped from the warning message.
- id: post__settings_data_management__apply_ttl_truncate
  path: /settings/data-management
  methods:
  - POST
  profile: dmttl
  request:
    method: POST
    form:
      apply_ttl: "1"
      ttl_logs_days: "0"
      ttl_traces_days: "0"
      ttl_sessions_days: "0"
      ttl_metrics_hours: "0"

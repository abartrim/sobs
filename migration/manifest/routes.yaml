# TagKey); the othersvc row carries only by_field. The applied set is a pure function of the constant
# log fields + rule conditions, so it is byte-deterministic. No mask: the POST's timeUnixNano and the
# frozen now() are the same fixed instant, so the stats-age block is constant. This GET is what
# byte-validates the Go matcher (matchSingleCondition / matchTagRule) against the Python oracle — a
# semantic divergence in any operator/field arm would change a rendered tag and flip this RED.
- id: get__logs__tagmatch
  path: /logs
  methods:
  - GET
  profile: tagmatch
  request:
    method: GET

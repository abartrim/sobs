# tagsuggest profile: seeded otel_logs/otel_traces/hyperdx_sessions + sobs_record_tags +
# sobs_log_attr_keys (seed_tagsuggest). The base route above hits the empty-fixture [] branch;
# these exercise every non-empty scope/target/field branch of api_tag_rule_condition_suggestions
# (handlers_misc.go handleApiTagRuleConditionSuggestions -> tag_condition_suggestions.go builders).
# Each result is ranked count() DESC then by the grouped value, so the ordering is deterministic.
# --- scope=tag_rule, target=attr_key (attr-key cache union over log/span/resource/scope) ---
- id: get__api_tagsug_attrkey_all
  path: /api/settings/tags/condition-suggestions
  profile: tagsuggest
  methods:
  - GET
  request:
    method: GET
    query: {scope: tag_rule, target: attr_key}
- id: get__api_tagsug_attrkey_http
  path: /api/settings/tags/condition-suggestions
  profile: tagsuggest
  methods:
  - GET
  request:
    method: GET
    query: {scope: tag_rule, target: attr_key, q: http}
# --- scope=tag_rule, target=value (per-field distinct-value lookups) ---
- id: get__api_tagsug_value_service_name

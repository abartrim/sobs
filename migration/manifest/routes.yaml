# the server must inflate gzip/deflate request bodies before parsing (app.py _decompress_request_body
# / Go decompressRequestBody). These compressed bodies decode to the same OTLP-JSON as the
# post__v1_*__ingest entries above (response {"accepted": 1}); regenerate the deterministic body_b64
# with migration/tools/gen_otlp_gzip_fixtures.py. body_b64 omits an auto Content-Type, so it is set
# explicitly alongside Content-Encoding.

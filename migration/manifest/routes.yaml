# sent as Content-Type: application/x-protobuf — the OTel Collector otlphttp exporter default and
# what most OTEL SDKs emit. These guard the C3 data-loss gap: before protobuf ingest was wired, the
# default OTLP wire format was silently accepted-and-dropped (zero rows, response falsely said
# accepted:0). The Python oracle (_parse_otlp_request) and Go (otlpProtoToMap) decode the IDENTICAL
# body_b64 bytes and must both return {"accepted": 1}. Regenerate the bytes with:
#   go test ./cmd/sobs -run TestGenerateOTLPProtoFixtures -v

    body_b64: eNp9j80KwjAQhF9F9iwlhbaCZ6+KF71ID9u4hGCblPwUpeTdTdoqCmIOIbM784UZwZDV3nDakzOSW9iuLuN7GNUI6OKm8Y6W5Y0e8QGWzCA5ZQo7gvUKBmz9HLDRr8R50YC9hBDqED2W6/77p+5TTKiY4L3PvEUxcQV6MXOv6PCopXKL3cmOTkreD6h0iuUbVuRVURUle50EQLvTvmkTg2VlGvwuxLX5X4RNNer5qsMT3CdmXg==
# Sender claims gzip but the body is plain JSON (no gzip magic): app.py's decompressor raises and
# the JSON path returns 400 {"error": "failed to read request body"}; the Go port must match. The
# 32 MiB decompression-bomb cap (reject-oversize) is verified by the Go unit test
# TestDecompressRequestBodyCapBoundary, avoiding a multi-MiB blob in the manifest. No insert (the
# body is rejected before parsing), so this stays in the base profile.
- id: post__v1_logs__gzip_invalid

# reader), so the data-management / repositories / github-health readers above see an EMPTY
# registry. Each POST inserts a row (explicit deterministic id -> no uuid); the following GET
# reads it back from chdb, exercising the serialize-from-stored-row path. Order matters: a
# create must precede the GET that reads it.

# HUMAN-AUTHORED route manifest — the request specs that drive capture & replay.
#
# Start from routes.generated.yaml (run extract_routes.py --yaml). For each route, add
# a `request:` block describing the EXACT request to issue and any `state:` setup the
# route needs. A route with no `request:` is captured as a bare GET of its path with no
# body — fine for simple pages, insufficient for POST/PATCH/stateful routes.
#
# The set of ids here MUST cover every id in routes.generated.yaml, minus EXCLUSIONS.yaml.
# parity_check.py enforces this (no silent gaps).
#
# request fields:
#   method:    override (defaults to the route's first method)
#   query:     {k: v}  -> urlencoded query string
#   headers:   {Name: value}
#   json:      <obj>   -> body = json.dumps(obj), Content-Type: application/json
#   body_b64:  "..."   -> raw body bytes (for protobuf OTLP, form posts, etc.)
# state:       optional list of setup ops applied before the request (e.g. seed a
#              specific row). Implement handlers in capture/replay as needed; prefer
#              baking state into seed_fixtures.py so it's identical for both sides.

routes:
  # ---- Phase 1 smoke subset (real paths, verified against the live url_map) ----
  # /health returns jsonify({"status":"ok","version":"1.0.0"}) — no DB. First JSON target.
  - id: get__health
    path: "/health"
    methods: [GET]
    request: {method: GET}

  # First data-backed route: SELECT 1 against the shared chdb fixture DB.
  - id: get__health_db
    path: "/health/db"
    methods: [GET]
    request: {method: GET}

  # A first-party static asset — exercises static serving (no DB, no template).
  - id: get__static_sobs_ansi_js
    path: "/static/sobs-ansi.js"
    methods: [GET]
    request: {method: GET}

  # A *_help.html page — exercises the template engine + base.html chrome + context
  # processor. Registered dynamically via _register_help_route.
  - id: get__ai_help
    path: "/ai/help"
    methods: [GET]
    request: {method: GET}

  # ---- Example JSON route with a body ----

# view_ai raw-SQL query-EXECUTION error branch (app.py 18747-18751). The sql fragment passes
# _validate_user_sql_where (no write/DDL keyword) and _normalize_ai_sql_where (no replaced token),
# but references a column that does not exist, so chdb raises UNKNOWN_IDENTIFIER on BOTH the COUNT
# query (inside the try -> except sets error_msg = "SQL error: " + _public_dashboard_query_error(exc),
# total=0, rows=[]) AND the unconditional totals query (18938 -> 18955-18956 metadata_errors append),
# so the metadata-error alert block (18958-18960) also renders. The sanitized first-line message is
# byte-identical on both sides (same libchdb + same SQL, no now()/uuid/elapsed content). NOTE: the
# except branch does NOT reset `params` (only `where`), but for this no-param sql route params stays
# []; the totals query reuses the still-nonexistent_col `where`, so it errors deterministically.
# ISOLATED profile (own capture process): the oracle's view_ai mutates the ALIASED cached
# _ai_filter_metadata "errors" list when appending "totals=...", which would leak this alert into a
# same-process plain-airich golden (Go does not alias the cache). Mirrors get__logs__logsrich_sql_exec_error.
- id: get__ai__airichsql_sql_exec_error
  path: /ai
  methods:
  - GET
  profile: airichsql
  request:
    method: GET
    query:
      sql: nonexistent_col=1
# view_ai _safe_attr_int defensive branches under the airich seed (ONE AI span with a non-numeric
# input_tokens "abc" and an infinite output_tokens "inf"): float(str(...)) raises ValueError on
# "abc" (app.py 18757-18758 -> 0) and parses "inf" to +inf, tripping the NaN/inf guard (18760 -> 0).
# Both token cells render as 0, so the page is deterministic. Default flat view, no filters.
- id: get__ai__airich
  path: /ai
  methods:
  - GET
  profile: airich
  request:
    method: GET
    query: {}
# aiturns profile: GET /ai?view=trace over an isolated trace (aiturnstrace1) of 5 AI spans across 2
# gen_ai.turn_ids, each carrying a distinct gen_ai.input/output.messages JSON shape. The trace view
# groups the spans, builds the per-turn cards (_build_ai_trace_turn_cards: group/sort by
# (started_at, turn_id)/enumerate), and renders the GenAI message text via the full parser cluster
# (_genai_message_content_to_text content-str/content-list/parts text+reasoning+tool_call+
# tool_call_response/tool_calls/function_call arms; _extract_messages_text; _genai_tool_calls_to_text).
# All text is CONSTANT and prompts are < 80 chars (the span-summary truncation slice) so the FULL
# parser output byte-compares. Fixed 2023 timestamps + UInt64 Duration -> every rendered ts/duration
# is constant and otel_traces has NO static TTL, so NO now()-anchoring and NO masks are needed.
- id: get__ai__aiturns
  path: /ai
  methods:
  - GET
  profile: aiturns
  request:
    method: GET
    query:
      view: trace

# issue_rum_client_token enabled path (rumtoken profile: origin mode + signing key). Issues a signed
# token; expiresAt/origin/app are deterministic (frozen clock + fixed payload), only the token value
# (embeds a random jti uuid + its HMAC) is masked.
- id: post__v1_rum_client_token__rt_issue
  path: /v1/rum/client-token
  methods:
  - POST
  profile: rumtoken
  request:
    method: POST
    json: {appName: parity-app, origin: 'https://app.example', ttlSec: 300}
  mask:
  - '"token": ?"[^"]*"'
  mask_reason: token = b64url(claims).hmac where claims embed a random jti uuid (Go uuid is not parity-frozen) so the token bytes differ each run; expiresAt (frozen now+ttl), origin, and app are deterministic and byte-compared.
# ---------------------------------------------------------------------------
# M26: POST /v1/rum (ingest_rum) — RUM client-auth verification (_verify_rum_client_auth)
# AND JS source-map console-stack remap (_sourcemap_lookup_for_file chain), both under the
# `rumauthmap` profile (RUM_CLIENT_AUTH_MODE=origin + fixed signing key + SOURCE_MAP_ENABLE +
# the committed migration/fixtures/sourcemaps/app.min.js.map). Tokens are pre-signed offline with
# the profile's signing key; the success token's exp=4102444800 (year 2100) so the expiry check
# passes wall-clock-independently. The response is {"accepted": <count>} — a pure seeded count, so
# byte-parity verifies BOTH runtimes reach the SAME accept/reject decision (and on the success path,
# both run the source-map remap into the stored Body). No mask needed.
#
# SUCCESS: a header X-SOBS-RUM-Token + matching Origin; an error event whose `stack` references
# app.min.js:1:5 (resolves to myFunc (src.js:1:1)); appName matches the token's bound app. The body
# token on a second event also exercises the per-event clientAuthToken fallback. -> 200 accepted:2.

# Validate a spec — valid (builder spec, empty result on this fixture renders the placeholder).
- id: post__api_dashboards_spec_validate_ok
  path: /api/dashboards/spec/validate
  methods:
  - POST
  request:
    method: POST
    json:
      spec:
        template_id: derived_signal_overlay
        sql:
          mode: builder
        data:
          service: api
# Validate a spec — invalid (raw query column count below the template minimum -> render raises).
- id: post__api_dashboards_spec_validate_bad_cols
  path: /api/dashboards/spec/validate
  methods:
  - POST
  request:
    method: POST
    json:
      spec:
        template_id: time_series_percentiles
        sql:
          mode: raw
          override_sql: SELECT toUInt32(5) AS a, 1.5 AS b
# Dry-run a spec: compile + execute (typed result -> column_types) + a named query.
- id: post__api_dashboards_spec_dry_run_ok
  path: /api/dashboards/spec/dry-run
  methods:
  - POST
  request:
    method: POST
    json:
      spec:
        template_id: time_series_percentiles
        sql:
          mode: raw
          override_sql: SELECT toUInt32(5) AS a, 1.5 AS b, 'x' AS c
        named_queries:
        - name: extra
          sql: SELECT toUInt8(7) AS v
          purpose: side dataset
# Set a CVE finding disposition (mutator; inserts into sobs_cve_dispositions. The frozen-clock
# updated_at is deterministic; CreatedAt/Version_ are not in the response).
- id: post__api_enrichment_cve_disposition_ok
  path: /api/enrichment/cve/findings/GHSA-abc-123/disposition
  methods:
  - POST
  request:
    method: POST
    json:
      package: lodash
      ecosystem: npm
      version: 4.17.0
      disposition: accepted
      note: reviewed and accepted
# MCP unauthenticated JSON-RPC methods (no API key needed): initialize / ping / notifications.
- id: post__mcp_initialize
  path: /mcp
  methods:
  - POST
  request:
    method: POST
    json:
      jsonrpc: '2.0'
      id: 1
      method: initialize
- id: post__mcp_ping
  path: /mcp
  methods:
  - POST
  request:
    method: POST
    json:
      jsonrpc: '2.0'
      id: ping-1
      method: ping
- id: post__mcp_notification
  path: /mcp
  methods:
  - POST
  request:
    method: POST
    json:
      jsonrpc: '2.0'
      method: notifications/initialized
# Execute a chart query (deterministic typed literals exercise Int/Float/String serialization).
- id: post__api_dashboards_query_ok
  path: /api/dashboards/query
  methods:
  - POST
  request:
    method: POST
    json:
      query: SELECT toUInt32(5) AS a, 1.5 AS b, 'x' AS c, toInt64(9999999999) AS big
# Compile success paths (deterministic transform; no DB execution, no mutation).
- id: post__api_dashboards_spec_compile_builder_ok
  path: /api/dashboards/spec/compile
  methods:
  - POST
  request:
    method: POST
    json:
      spec:
        template_id: derived_signal_overlay
        sql:
          mode: builder
        data:
          service: api
          signal_source: traces
          signal_name: trace_volume
          window_hours: 12
          limit: 500
- id: post__api_dashboards_spec_compile_raw_ok
  path: /api/dashboards/spec/compile
  methods:
  - POST
  request:
    method: POST
    json:
      spec:
        template_id: time_series_percentiles
        sql:
          mode: raw
          override_sql: SELECT toStartOfMinute(Timestamp) AS time, count() AS value FROM otel_logs GROUP BY time ORDER BY time
- id: post__api_dashboards_spec_validate
  path: /api/dashboards/spec/validate
  methods:
  - POST
  request:
    method: POST
    json: {}
- id: post__api_dashboards_spec_dry_run
  path: /api/dashboards/spec/dry-run
  methods:
  - POST
  request:
    method: POST
    json: {}
- id: post__api_dashboards_spec_render
  path: /api/dashboards/spec/render
  methods:
  - POST
  request:
    method: POST
    json: {}
# spec/render success: compile + execute + render + visual-overrides + OUTPUT MASKING (the
# time/DateTime values mask to "****" via the redact datetime fallthrough). Covers a standard
# template, derived_signal_overlay (anomaly engine), gauge w/ visual overrides, builder->empty.
- id: post__api_dashboards_spec_render_timeseries
  path: /api/dashboards/spec/render
  methods: [POST]
  request:
    method: POST
    json:
      spec:
        template_id: time_series_percentiles
        sql:
          mode: raw
          override_sql: SELECT toDateTime('2024-01-01 00:00:00') AS time, 2.0 AS value, 3.0 AS p95, 4.0 AS p99
- id: post__api_dashboards_spec_render_derived
  path: /api/dashboards/spec/render
  methods: [POST]
  request:
    method: POST
    json:
      spec:
        template_id: derived_signal_overlay
        sql:
          mode: raw
          override_sql: SELECT toDateTime('2024-01-01 00:00:00') AS time, 'trace-svc-0' AS service, 'traces' AS source, 'latency_p95_ms' AS signal, '' AS attr_fp, 500.0 AS value, toUInt32(10) AS sample_count, 100.0 AS baseline_mean, 50.0 AS baseline_lower, 150.0 AS baseline_upper, 'outlier' AS anomaly_state, 0.9 AS anomaly_score
- id: post__api_dashboards_spec_render_gauge_overrides
  path: /api/dashboards/spec/render
  methods: [POST]
  request:
    method: POST
    json:
      spec:
        template_id: gauge_kpi
        sql:
          mode: raw
          override_sql: SELECT 88.0 AS value
        visual:
          legend_show: false
          zoom_slider: true
- id: post__api_dashboards_spec_render_builder_empty
  path: /api/dashboards/spec/render
  methods: [POST]
  request:
    method: POST
    json:
      spec:
        template_id: derived_signal_overlay
        sql:
          mode: builder
        data:
          service: api
- id: post__api_dashboards_query
  path: /api/dashboards/query
  methods:
  - POST
  request:
    method: POST

  profile: rumvitals
  mask:
  - '"t": "[^"]*"'
  - '[0-9]{4}-[0-9]{2}-[0-9]{2}[ +][0-9]{2}:[0-9]{2}:[0-9]{2}'
  - '[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}'
  - '[0-9]{4}-[0-9]{2}-[0-9]{2}'

- id: get__traces
  path: /traces
  methods:
  - GET
  request:
    method: GET
# tracedetail profile: a seeded multi-span trace (otel_traces + a few non-error otel_logs). With
# trace_id set, view_traces builds the populated trace_detail waterfall — span tree, active/gap
# timeline, coverage, per-span offset/width, log counts. anomaly/metrics/raw-windows take their
# empty paths (trace at 2023-06-01, no metrics seeded), so the render is deterministic.
- id: get__traces__tracedetail
  path: /traces
  methods:
  - GET
  profile: tracedetail
  request:
    method: GET
    query:
      trace_id: aaaa1111bbbb2222cccc3333dddd4444
# Same trace, paged: trace_span_limit=2 & trace_span_offset=2 forces the span-tree slice to pull
# in ancestor context rows and renders the prev/next pagination — exercising
# _slice_span_tree_with_ancestors' ancestor-expansion branch.
- id: get__traces__tracedetail_paged
  path: /traces
  methods:
  - GET
  profile: tracedetail
  request:
    method: GET
    query:
      trace_id: aaaa1111bbbb2222cccc3333dddd4444
      trace_span_limit: 2
      trace_span_offset: 2
# Same tracedetail seed, LIST view (no trace_id): a service filter and a regex(q) filter drive the
# selected_services / q-prepare / regex-clause / count-with-where / spans-loop branches of
# view_traces. Distinct seed timestamps keep ORDER BY Timestamp DESC deterministic.
- id: get__traces__tracedetail_service
  path: /traces
  methods:
  - GET
  profile: tracedetail
  request:
    method: GET
    query:
      service: checkout
- id: get__traces__tracedetail_q
  path: /traces
  methods:
  - GET
  profile: tracedetail
  request:
    method: GET
    query:
      q: checkout
# logsview profile: seeded otel_logs (6 rows, distinct timestamps + distinct level/service counts)
# plus two record tags. Drives view_logs' POPULATED branches: the rows/record-id/snapshot block,
# every filter (level / service / event_name / trace_id / trace_ids), the raw-SQL-where path incl.
# the has_tag() translation and time-window append, the regex(q) clauses, and the batch-tag join.
# Deterministic via fixed seed timestamps + frozen now(); tie-free stats avoid ORDER BY ambiguity.
- id: get__logs__logsview
  path: /logs
  methods:
  - GET
  profile: logsview
  request:
    method: GET
- id: get__logs__logsview_level
  path: /logs
  methods:
  - GET
  profile: logsview
  request:
    method: GET

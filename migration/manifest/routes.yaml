- id: get__settings_data_management
  path: /settings/data-management
  methods:
  - GET
  mask:
  - <table class="table table-sm table-hover mb-0 dm-stats-table">[\s\S]*?</table>
  - Total rows \(active parts\)</td>\s*<td class="fw-semibold">\s*[0-9,]+
  - <td class="fw-semibold">[0-9][0-9.]* [A-Z]*B</td>
  - "[0-9]+\\.[0-9]+\xD7|[0-9]+\xD7"
  - <span class="text-(?:warning|success)">\s*[0-9]+
  mask_reason: "The db-stats card is derived from chdb system.parts, whose active-part/merge state is non-deterministic in-sequence (the determinism harness cannot freeze chdb's C-level merge scheduler) — total_rows, the per-table breakdown (count, sizes, ratios, order), overall byte sizes/ratios, and active-query count all vary between Python capture and Go replay. The functional DM settings form below is byte-compared."

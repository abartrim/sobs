# profile is isolated (its own fixture copy) so the schema mutations never ripple into base otel
# readers. These three entries run IN ORDER on one server. NOTE: ttl_metrics_hours' ALTER builds
# intDiv(TimeUnixMs, …) but TimeUnixMs is a DateTime column, so chDB rejects it (ILLEGAL_TYPE) — a

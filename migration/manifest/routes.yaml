# appreg: SOBS_APP_REGISTRY_SEED_JSON drives _seed_app_release_registry_from_env (app.py 8935) at
# boot so the registry is POPULATED with two real apps (a1…01 Alpha Service, a1…02 Beta Worker),
# two releases under Alpha, and two artifacts under Alpha's 2.1.0 release. These read routes
# byte-verify the seeded graph; the boot itself covers the seeder's happy + every skip branch.
# list_apps ORDER BY Name ASC: Alpha Service then Beta Worker. createdAt/updatedAt are _now_iso()
# at boot (not overridable) so they drift per-process -> field-masked; everything else is byte-equal.
- id: get__v1_apps__appreg
  path: /v1/apps
  methods:
  - GET
  profile: appreg
  request:
    method: GET
  mask:
  - '"createdAt": ?"[^"]*"'
  - '"updatedAt": ?"[^"]*"'
  mask_reason: each app's createdAt/updatedAt is _now_iso() set at boot by the registry seeder (not JSON-overridable), so it differs between the oracle capture and the Go replay; the value is masked per-field while name/slug/ownerTeam/repoUrl/enabled/metadata and the Name-ASC ordering are byte-compared.
# list_apps q-filter branch (app.py 10308-10309): ?q=alpha matches only Alpha Service (substring of
# name.lower()), so Beta Worker drops -> the comprehension's filter arm is exercised deterministically.
- id: get__v1_apps__appreg_q
  path: /v1/apps
  methods:
  - GET
  profile: appreg

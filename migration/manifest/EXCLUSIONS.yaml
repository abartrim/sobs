# Routes deliberately excluded from byte-for-byte parity. Prefer a per-route `mask` in
# routes.yaml (neutralize the few random/wall-clock bytes, byte-compare everything else) or a
# bounded `stream` capture over a whole-route exclusion.

exclusions:
  # /logs renders otel_logs `ORDER BY Timestamp DESC`, but the example seeder stamps every row with
  # the same frozen-clock timestamp, so the result set is entirely ties. SQL leaves the order of
  # equal-key rows engine-defined, and chDB breaks those ties differently between the Python wheel
  # and the Go chdb-core build on linux/amd64 (they happen to agree on arm64) — identical bytes,
  # rows reordered. Inherent ORDER BY tie non-determinism across platforms, not a port defect.
  - id: get__logs
    reason: "ORDER BY Timestamp tie order is engine/platform-defined; all seeded rows share one timestamp"

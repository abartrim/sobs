[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["annotation-unchecked"]

[tool.djlint]
profile = "jinja"
extension = "html"
max_line_length = 120
format_css = true
format_js = true
ignore = "H006,H014,H020,H021,H023,H025,H030,H031,H037,T001,T002,T003,T027,T028"
